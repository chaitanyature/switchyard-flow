name: Scheduler checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Both the minimum supported Python and the newer test runtime have builds here.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
